<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx=".3" cy=".2" r="1">
      <stop offset="0" stop-color="#3a4252"/>
      <stop offset=".6" stop-color="#1c212b"/>
      <stop offset="1" stop-color="#11141a"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset=".5" stop-color="#e2a93a"/>
      <stop offset="1" stop-color="#ffd36b"/>
    </linearGradient>
    <linearGradient id="u" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a6b"/>
      <stop offset=".55" stop-color="#ef3b42"/>
      <stop offset="1" stop-color="#b8141f"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lit" cx=".4" cy=".35" r=".8">
      <stop offset="0" stop-color="#fff6cf"/>
      <stop offset=".6" stop-color="#ffd04d"/>
      <stop offset="1" stop-color="#ff9d14"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#bg)"/>
  <rect x="1.75" y="1.75" width="60.5" height="60.5" rx="14.3" fill="none" stroke="url(#rim)" stroke-width="2.5"/>
  <!-- U as a little brick house: two gabled towers -->
  <path fill="url(#u)" d="M10.5 23 L19 14 L27.5 23 V39 a4.5 4.5 0 0 0 9 0 V23 L45 14 L53.5 23 V40 a21.5 21.5 0 0 1 -43 0 Z"/>
  <path fill="url(#gloss)" d="M10.5 23 L19 14 L27.5 23 V30 H10.5 Z M36.5 23 L45 14 L53.5 23 V30 H36.5 Z"/>
  <!-- glowing windows: lights on, someone's home -->
  <rect x="14" y="26" width="9.5" height="10" rx="2" fill="#ffc94d" filter="url(#glow)" opacity=".85"/>
  <rect x="40.5" y="26" width="9.5" height="10" rx="2" fill="#ffc94d" filter="url(#glow)" opacity=".85"/>
  <rect x="14.5" y="26.5" width="8.5" height="9" rx="1.8" fill="url(#lit)" stroke="#7a1018" stroke-width="1.2"/>
  <rect x="41" y="26.5" width="8.5" height="9" rx="1.8" fill="url(#lit)" stroke="#7a1018" stroke-width="1.2"/>
  <!-- sparkle -->
  <path d="M53 5.5 l1.3 3.6 3.6 1.3 -3.6 1.3 -1.3 3.6 -1.3 -3.6 -3.6 -1.3 3.6 -1.3 z" fill="#ffe7a3"/>
